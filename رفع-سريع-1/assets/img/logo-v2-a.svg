<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- NÉON v2-A — «Horizontal Blade» : نسخة مطوّرة بخط أوضح وموزون بصريًا -->

  <!-- الطبقة الخلفية (إسبريسو): قوس كبير مفتوح ينحني حول خط الانطلاق -->
  <path d="M226 84 C 352 70 438 158 436 254 C 434 332 354 380 262 388 C 206 391 168 420 166 448"
        fill="none" stroke="#3A241A" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- الطبقة الأمامية (كريم): عمود أيسر + نصل أفقي يتموّج ويصعد يمينًا -->
  <path d="M162 132 L 162 336" stroke="#D9B57C" stroke-width="34" stroke-linecap="round"/>
  <path d="M132 240 C 238 240 246 254 326 298 C 382 326 434 300 452 256"
        fill="none" stroke="#D9B57C" stroke-width="30" stroke-linecap="round"/>

  <!-- نقطة التوهج بين المنحنيين -->
  <circle cx="424" cy="240" r="14" fill="#D9B57C"/>
</svg>
