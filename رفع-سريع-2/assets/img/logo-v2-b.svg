<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- NÉON v2-B — «Geometric Interlock» : خطوط هندسية نظيفة — تصلح للأيقونة -->

  <!-- إسبريسو: قوس سداسي مفتوح بزاوية بسيطة (60 درجة) يمثل التدفق -->
  <path d="M208 96 L 330 96 A 132 132 0 0 1 434 204 A 132 132 0 0 1 330 330 L 252 330"
        fill="none" stroke="#3A241A" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- كريم: جناح أفقي قاطع + عمود أيسر مؤمن -->
  <path d="M150 262 L 340 262" stroke="#D9B57C" stroke-width="32" stroke-linecap="round"/>
  <path d="M150 150 L 150 372" stroke="#D9B57C" stroke-width="32" stroke-linecap="round"/>

  <!-- نهاية النصل — ذيل مائي ناعم -->
  <path d="M340 262 L 396 262" stroke="#D9B57C" stroke-width="14" stroke-linecap="round"/>
</svg>
