    <radialGradient id="oglow2" cx="0" cy="0" r="1" gradientTransform="translate(1000 520) rotate(-130) scale(460)" gradientUnits="userSpaceOnUse"><stop stop-color="#ff3ddc" stop-opacity=".22"/><stop offset="1" stop-color="#ff3ddc" stop-opacity="0"/></radialGradient>
    <filter id="oglowf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="ogrid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0v60" fill="none" stroke="#7dd3fc" stroke-opacity=".06"/></pattern>
