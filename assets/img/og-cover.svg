    </linearGradient>
    <linearGradient id="ograd" x1="160" y1="170" x2="1050" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22e7ff"/><stop offset=".52" stop-color="#8b5cff"/><stop offset="1" stop-color="#ff3ddc"/>
